<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic_Css</title>
    <style>
        /* สีแดง */
        h1{
            color: red;
            font-size: 50px;
        }
        .title{
            color: blue;
            font-size: 30px;
        }
        #title{
            color: green;
            font-size: 20px;
        }
        p,.title{
            font-style: italic;
            font-size: 40px;
        }
        p.message{
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>Cssเบื้องต้น</h1>
    <h1 class="title" id="title">Anusak</h1>
    <h1 class="title">Css3</h1>
    <p>lorem ipsum dolor sit amet</p>
    <p class="message">This is a paragraph with a message.</p>
    <a href="page1.html">This is a link</a>
</body>
</html>
