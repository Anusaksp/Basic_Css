<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Format</title>
    <style>
        .test{
            color: rgb(0, 255, 34);
            font-size: 20px;
            font-weight: bolder;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p style="color: blue; font-size: 20px; font-weight: bolder;">Anusak</p>
    <p class="test">Lorem ipsum dolor sit amet consectetur adipisicing elit. Earum quibusdam eum beatae hic in a maiores at dolorum non maxime.</p>
    <h1>Anusak</h1>
    <h1 class="title">CSS</h1>
    <p id="message">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aliquam nam facilis libero tempora aperiam similique?</p>

</body>
</html>
